[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "spending-optimiser"
version = "0.1.0"
description = "Local evidence-backed transaction import and review ledger"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.12.3",
    "fastapi==0.119.1",
    "uvicorn==0.38.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.20",
    "google-auth==2.62.0",
    "google-auth-oauthlib==1.5.0",
    "keyring==25.7.0",
    "requests==2.34.2",
    "itsdangerous==2.2.0",
]

[project.scripts]
spending-optimiser = "spending_optimiser.web:main"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.2", "httpx==0.28.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/spending_optimiser"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
