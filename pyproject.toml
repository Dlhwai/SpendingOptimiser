[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "spending-optimiser"
version = "0.1.0"
description = "Evidence-backed domain schemas for SpendingOptimiser"
requires-python = ">=3.11"
dependencies = ["pydantic==2.12.3"]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/spending_optimiser"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
